name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows too: it is where this is developed, and where the shell, the code page and the exit crash were found.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The version this lockfile was made with: a newer npm resolves one optional peer differently.
          node-version: 24.12.0
          cache: npm
      # The lockfile records the xavierjev dependency as git+ssh, and a runner has no SSH key.
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # The gate's dev set on the offline allow-list: no model needed, and any false allow fails the run.
      - run: npm run eval:risk-gate -- --backend allowlist

  sandbox:
    # The escape tests on a real sandbox: sandbox-runtime on bubblewrap. Every blocked case has a
    # control showing the same write or connection works outside, so a sandbox that never came up
    # fails here rather than passing.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # What srt needs on Linux, as its own CI installs it.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor, which stops bubblewrap;
      # srt's README and CI lift that. The runner is thrown away after the job.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # bubblewrap on its own first, as srt's CI checks it: a failure here is the runner's, not srt's.
      - run: bwrap --version && bwrap --unshare-pid --unshare-user --cap-drop ALL --ro-bind / / --proc /proc true
      - run: npm ci
      - run: npm run test:sandbox -- --backend srt

  sandbox-windows:
    # sandbox-runtime's Windows side, which srt calls alpha. Its one-time install creates the
    # srt-sandbox account and WFP filters: on a runner, an administrator with UAC off that is
    # thrown away after the job, it runs unattended, as in srt's own CI. Allowed to fail meanwhile.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: node node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js windows-install
      # The workspace under the profile's temp directory, then on the D: drive, where any signed-in
      # user may modify new folders and srt confined writes only from 0.0.81 on.
      - run: npm run test:sandbox -- --backend srt
      - run: npm run test:sandbox -- --backend srt --root "$env:RUNNER_TEMP"
