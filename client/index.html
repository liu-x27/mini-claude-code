<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bd6'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='white'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before the first paint, so a terminal user never
      // sees a flash of the light theme. Same rule as initialTheme() in lib/theme.ts.
      (() => {
        const saved = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          saved === "product" || saved === "terminal"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches ? "terminal" : "product";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
